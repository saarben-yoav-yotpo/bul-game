<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>בּוּל!</title>
<meta name="description" content="משחק חיקויים: שומעים קטע, שרים למיקרופון, ומקבלים ציון כמה זה דומה.">
<meta property="og:title" content="בּוּל! 🎤 כמה אתם נשמעים כמוהם?">
<meta property="og:description" content="שומעים קטע, שרים למיקרופון, ומקבלים ציון על מנגינה, קצב ודמיון קול.">
<meta name="theme-color" content="#170d1c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;800&family=Secular+One&display=swap">
<style>
/* Layout: full-screen vertical snap cards (TikTok), one challenge per screen; party mode is a step-by-step stage. Single deliberate dark "stage" look. */
:root{
  --stage:#170d1c; --curtain:#24112a; --spot:#ffc94d; --voice:#ff5d8f; --target:#6fe3d4;
  --ink:#fbf3e6; --muted:#bfaec3; --line:rgba(251,243,230,.14); --glass:rgba(23,13,28,.55);
  --display:"Secular One","Assistant",system-ui,sans-serif; --body:"Assistant",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--stage);color:var(--ink);font-family:var(--body);font-size:16px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--spot);outline-offset:3px}
[hidden]{display:none!important}

.app{position:fixed;inset:0;display:flex;flex-direction:column}
.topbar{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(to bottom,rgba(23,13,28,.85),rgba(23,13,28,0))}
.logo{font-family:var(--display);font-size:22px;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.logo i{width:10px;height:10px;border-radius:50%;background:var(--voice);box-shadow:0 0 12px var(--voice);display:inline-block}
.tabs{display:flex;background:rgba(255,255,255,.08);border-radius:999px;padding:3px}
.tabs button{padding:6px 14px;border-radius:999px;font-weight:700;font-size:15px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--stage)}

/* challenge feed */
.feed{flex:1;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.card{position:relative;height:100%;min-height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;
  display:flex;flex-direction:column;justify-content:flex-end;
  padding:calc(env(safe-area-inset-top,0px) + 64px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 22px) max(16px,env(safe-area-inset-left,0px));
  background:radial-gradient(120% 60% at 50% 0%,var(--tint) 0%,transparent 70%),radial-gradient(80% 50% at 50% 115%,rgba(255,201,77,.18),transparent 70%),var(--stage)}
.card .beam{position:absolute;top:-10%;left:50%;width:140%;height:80%;transform:translateX(-50%);pointer-events:none;
  background:conic-gradient(from 160deg at 50% 0%,transparent 0deg,rgba(255,240,200,.07) 20deg,transparent 40deg);}
.cardInner{position:relative;display:flex;flex-direction:column;gap:14px;max-width:560px;width:100%;margin:0 auto;min-width:0;padding-left:64px}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{font-size:13px;font-weight:800;letter-spacing:.4px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.12)}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
h2.title{font-family:var(--display);font-weight:400;font-size:clamp(30px,8.5vw,46px);line-height:1.02;margin:0;text-wrap:balance}
.artist{color:var(--muted);font-size:16px;margin-top:-8px}
.stageBox{position:relative;width:100%;}
.vid{position:absolute;inset:0;border-radius:14px;overflow:hidden;background:#000;z-index:3}
.vid iframe{width:100%;height:100%;border:0;display:block}
.vid .x{position:absolute;top:6px;left:6px;z-index:4;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:18px;line-height:32px;text-align:center}
.btnTune{width:52px;height:52px;flex:none;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center}
.btnTune svg{width:22px;height:22px}
.roll{width:100%;height:170px;border-radius:14px;background:rgba(0,0,0,.28);border:1px solid var(--line);display:block}
.lyric{font-size:20px;font-weight:600;line-height:1.5;min-height:30px;unicode-bidi:plaintext}
.lyric span{transition:color .1s}
.lyric span.on{color:var(--spot);text-shadow:0 0 14px rgba(255,201,77,.5)}
.lyric span.done{color:var(--ink)}
.lyric span{color:rgba(251,243,230,.45)}
.tip{font-size:14px;color:var(--muted);line-height:1.45}
.controls{display:flex;align-items:center;gap:14px}
.btnPlay{display:flex;align-items:center;gap:8px;padding:14px 18px;border-radius:999px;background:rgba(255,255,255,.12);font-weight:800;font-size:16px;white-space:nowrap}
.btnPlay svg{width:20px;height:20px}
.btnMic{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;padding:16px 18px;border-radius:999px;background:var(--voice);color:#fff;font-weight:800;font-size:18px;
  box-shadow:0 8px 30px rgba(255,93,143,.35);white-space:nowrap}
.btnMic svg{width:22px;height:22px}
.btnMic.rec{background:#fff;color:var(--voice);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,93,143,.6)}50%{box-shadow:0 0 0 14px rgba(255,93,143,0)}}
.rail{position:absolute;left:max(10px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 120px);display:flex;flex-direction:column;gap:18px;align-items:center;z-index:2}
.rail a,.rail button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--ink);text-decoration:none}
.rail .ic{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center}
.rail .ic svg{width:22px;height:22px}
.rail .best{font-family:var(--display);font-size:18px;color:var(--spot)}
.swipe{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 4px);left:0;right:0;text-align:center;font-size:12px;color:var(--muted);opacity:.7}
.countdown{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:120px;color:var(--spot);pointer-events:none;text-shadow:0 0 40px rgba(255,201,77,.6);z-index:5}

/* intro card */
.intro .cardInner{justify-content:center;padding-left:0}
.intro h1{font-family:var(--display);font-weight:400;font-size:clamp(46px,14vw,78px);line-height:.95;margin:0}
.intro h1 em{font-style:normal;color:var(--voice)}
.intro p{font-size:18px;line-height:1.5;margin:0;color:var(--ink);max-width:30ch}
.steps{display:flex;flex-direction:column;gap:10px;margin:6px 0}
.steps div{display:flex;gap:12px;align-items:center;font-size:16px}
.steps b{font-family:var(--display);font-weight:400;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);color:var(--spot);flex:none}
.cta{align-self:flex-start;padding:14px 22px;border-radius:999px;background:var(--spot);color:var(--stage);font-weight:800;font-size:17px}

/* result sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--curtain);border-radius:24px 24px 0 0;border-top:1px solid var(--line);
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(16px,env(safe-area-inset-left,0px));
  transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.9,.3,1.1);box-shadow:0 -20px 60px rgba(0,0,0,.5);max-height:92%;overflow-y:auto}
.sheet.open{transform:none}
.sheetIn{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.scoreRow{display:flex;align-items:center;gap:18px}
.dial{position:relative;width:118px;height:118px;flex:none}
.dial svg{width:100%;height:100%;transform:rotate(-90deg)}
.dial .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:42px;font-variant-numeric:tabular-nums}
.verdict{font-family:var(--display);font-size:28px;line-height:1.1;color:var(--spot)}
.verdictSub{color:var(--muted);font-size:15px;margin-top:4px;line-height:1.4}
.meters{display:flex;flex-direction:column;gap:10px}
.meter{display:grid;grid-template-columns:92px 1fr 36px;align-items:center;gap:10px;font-size:15px;font-weight:600}
.meter .bar{height:10px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden}
.meter .bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--target),var(--spot));width:0;transition:width .9s ease}
.meter .v{text-align:left;font-variant-numeric:tabular-nums;color:var(--muted)}
.sheetBtns{display:flex;gap:10px;flex-wrap:wrap}
.sheetBtns button,.sheetBtns a{flex:1;min-width:120px;padding:13px 14px;border-radius:999px;font-weight:800;text-align:center;text-decoration:none;font-size:16px}
.b1{background:var(--spot);color:var(--stage)}
.b2{background:rgba(255,255,255,.12);color:var(--ink)}
.b3{background:#25d366;color:#08301a}
.msg{font-size:15px;line-height:1.5;color:var(--muted)}

/* party */
.party{flex:1;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 70px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 30px) max(16px,env(safe-area-inset-left,0px));
  background:radial-gradient(100% 50% at 50% 0%,#5a1a4a 0%,transparent 70%),var(--stage)}
.partyIn{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.party h2{font-family:var(--display);font-weight:400;font-size:clamp(32px,9vw,46px);margin:0;line-height:1}
.party p{margin:0;line-height:1.5;font-size:16px;color:var(--muted)}
.panel{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h3{margin:0;font-size:18px;display:flex;align-items:center;gap:10px}
.panel h3 b{font-family:var(--display);font-weight:400;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--spot);color:var(--stage);font-size:16px;flex:none}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.field input{font:inherit;font-size:17px;color:var(--ink);background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:12px;padding:12px}
.ideas{display:flex;gap:8px;flex-wrap:wrap}
.ideas button{font-size:14px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--ink)}
.board{display:flex;flex-direction:column;gap:8px}
.board .row{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.06)}
.board .row:first-child{background:rgba(255,201,77,.16)}
.board .rk{font-family:var(--display);color:var(--spot)}
.board .nm{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .sc{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.board .sub{grid-column:2/4;font-size:13px;color:var(--muted)}
.linkish{color:var(--muted);text-decoration:underline;font-size:14px;align-self:flex-start}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 30px);transform:translateX(-50%);background:var(--ink);color:var(--stage);padding:10px 16px;border-radius:12px;font-weight:700;z-index:50;max-width:90%;text-align:center}
@media (min-width:700px){ .rail{left:calc(50% - 360px)} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">

  <main class="feed" id="feed"></main>

  <section class="party" id="party" hidden>
    <div class="partyIn">

        </div>
        <p class="msg" id="srcMsg">שירו או אמרו משהו קצר, 3 עד 10 שניות. לחצו שוב כדי לעצור.</p>
      </div>

      <div class="panel" id="pStep2" hidden>
        <h3><b>2</b>תורכם לחקות</h3>
        <label class="field">שם המתחרה

        </label>
        <canvas class="roll" id="plRoll" width="600" height="170"></canvas>
        <div class="controls">
          <button class="btnPlay" id="plPlay"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>שמעו מקור</button>
          <button class="btnMic" id="plRec"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V22h2v-3.1A7 7 0 0 0 19 12z"/></svg><span>חקו עכשיו</span></button>
        </div>
        <p class="msg" id="plMsg">ההקלטה נעצרת לבד אחרי אורך המקור ועוד קצת.</p>
      </div>

      <div class="panel" id="pStep3" hidden>
        <h3><b>3</b>טבלת המסיבה</h3>
        <div class="board" id="board"></div>
        <button class="linkish" id="newRound">סיבוב חדש עם מקור אחר</button>
      </div>
    </div>
  </section>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="verdict">
  <div class="sheetIn">
    <div class="grab"></div>
    <div class="scoreRow">
      <div class="dial">
        <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="12"/>
          <circle id="dialArc" cx="60" cy="60" r="52" fill="none" stroke="#ffc94d" stroke-width="12" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="326.7" style="transition:stroke-dashoffset 1s ease"/></svg>
        <div class="num" id="dialNum">0</div>
      </div>
      <div>
        <div class="verdict" id="verdict"></div>
        <div class="verdictSub" id="verdictSub"></div>
      </div>
    </div>
    <div class="meters" id="meters"></div>
    <div class="sheetBtns">
      <button class="b1" id="sAgain">עוד פעם</button>
      <button class="b3" id="sShare">שתפו בוואטסאפ</button>
      <button class="b2" id="sNext">לשיר הבא</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

  const db20=20*Math.log10(A.maxR+1e-9); const power=clamp((db20+34)/26*100);
  return { total:Math.round(.4*rhythm+.35*voice+.25*power), meters:[["קצב",rhythm],["עומק הקול",voice],["עוצמה",power]],
    note: vm>ch.targetMidi+10? "יותר הוביט מגנדלף. נסו קול נמוך מהבטן." : "" };
}
function scoreHigh(ch,A){
  const V=A.voiced; let top=0, hold=0, stab=0;
  // highest pitch sustained for 0.25 s (12 frames)
  for(let i=0;i+12<=V.length;i++){ const w=V.slice(i,i+12); if(w[11].t-w[0].t>.4) continue; const md=median(w.map(f=>f.m)); if(md>top) top=md; }
  if(!top) return null;
  let run=[], bestRun=[]; V.forEach((f,i)=>{ if(f.m>=top-2 && (!run.length||f.t-run[run.length-1].t<.08)) run.push(f); else { if(run.length>bestRun.length) bestRun=run; run=f.m>=top-2?[f]:[]; } }); if(run.length>bestRun.length) bestRun=run;
  hold=bestRun.length? bestRun[bestRun.length-1].t-bestRun[0].t : 0;
  const ms=bestRun.map(f=>f.m); const mu=ms.reduce((a,b)=>a+b,0)/Math.max(1,ms.length); const sd=Math.sqrt(ms.reduce((a,b)=>a+(b-mu)**2,0)/Math.max(1,ms.length));
  const height=clamp((top-67)/(ch.targetMidi-67)*100); const holdS=clamp(hold/2.5*100); stab=clamp(100*(1-(sd-.15)/1.2));
  const names=["דו","דו#","רה","רה#","מי","פה","פה#","סול","סול#","לה","לה#","סי"]; const r=Math.round(top);
  return { total:Math.round(.62*height+.2*holdS+.18*stab), meters:[["גובה",height],["החזקה",holdS],["יציבות",stab]],
    note:`הצליל הכי גבוה שהחזקתם: ${names[(r%12+12)%12]} באוקטבה ${Math.floor(r/12)-1} (${Math.round(m2f(top))} הרץ).` };
}
function scoreParty(R,P){
  if(P.voiced.length<8||R.voiced.length<8){
    // fall back to rhythm-only for spoken/unvoiced sources
    if(R.voiced.length<8 && P.voiced.length>=0){ const ratio=Math.max(.05,P.t1-P.t0)/Math.max(.05,R.t1-R.t0); const rh=clamp(100*Math.exp(-1.6*Math.abs(Math.log(ratio)))); return {total:Math.round(rh*.6), meters:[["מנגינה",0],["קצב",rh],["דמיון לקול",0]]}; }
    return null; }
  const U=down(P.voiced,2), T=down(R.voiced,2); const r=bestKeyDTW(U,T);
  const melody=melodyFromCost(r.cost);
  const ratio=Math.max(.05,P.v1-P.v0)/Math.max(.05,R.v1-R.v0); const rhythm=rhythmFrom(ratio,r.dev);
  const reg=Math.abs(median(P.voiced.map(f=>f.m))-median(R.voiced.map(f=>f.m))); const regS=100*Math.exp(-reg/6);
  let tim=50; if(R.timbre&&P.timbre){ let s=0; R.timbre.forEach((v,k)=>s+=(v-P.timbre[k])**2); const d=Math.sqrt(s/R.timbre.length); tim=clamp(100*(1-(d-1.5)/6)); }
  const voice=clamp(.5*regS+.5*tim);
  return { total:Math.round(.36*melody+.24*rhythm+.4*voice), meters:[["מנגינה",melody],["קצב",rhythm],["דמיון לקול",voice]] };
}
function verdict(s){
  if(s>=90) return ["גרסת מקור","אי אפשר להבדיל. יש לך חוזה הקלטות?"];
  if(s>=80) return ["דיווה מוסמכת","עוד קצת ומזמינים אותך לאירוויזיון."];
  if(s>=65) return ["כוכב עולה","יש כאן משהו. עוד ניסיון ואתם שם."];
  if(s>=50) return ["זמר ליווי","באמצע הבמה, לא בקדמתה. בינתיים."];
  if(s>=35) return ["זמר מקלחת","במקלחת זה נשמע הרבה יותר טוב, נכון?"];
  return ["צפרדע בחורף","קרקור אמיץ. נסו שוב, הפעם קרוב יותר למיקרופון."];
}

/* ============ PIANO ROLL ============ */
function makeRoll(canvas){
  const st={target:[],live:[],dur:4,head:-1,lo:55,hi:80,offset:0,refLine:null};
  function fit(){ const dpr=Math.min(2,window.devicePixelRatio||1); const w=canvas.clientWidth||300, h=canvas.clientHeight||170; canvas.width=w*dpr; canvas.height=h*dpr; draw(); }
  function y(m,h){ return h-8-(m-st.lo)/(st.hi-st.lo)*(h-16); }
  function draw(){
    const c=canvas.getContext("2d"), W=canvas.width, H=canvas.height, dpr=Math.min(2,window.devicePixelRatio||1);
    c.clearRect(0,0,W,H); const x=t=>W-(t/st.dur)*W; // RTL time flows right->left? keep LTR for music: left->right
    const X=t=>(t/st.dur)*W;
    c.strokeStyle="rgba(251,243,230,.06)"; c.lineWidth=1; for(let m=Math.ceil(st.lo);m<=st.hi;m++){ if(m%12===0||m%12===5){ c.beginPath(); c.moveTo(0,y(m,H)); c.lineTo(W,y(m,H)); c.stroke(); } }
    st.target.forEach(n=>{ c.fillStyle="rgba(111,227,212,.75)"; const yy=y(n.m,H); const r=6*dpr; c.beginPath(); c.roundRect?c.roundRect(X(n.t)+1,yy-r,Math.max(4,X(n.d)-3),r*2,r):c.rect(X(n.t)+1,yy-r,Math.max(4,X(n.d)-3),r*2); c.fill(); });
    if(st.refLine){ c.strokeStyle="rgba(111,227,212,.85)"; c.lineWidth=3*dpr; c.lineCap="round"; let pv=null; c.beginPath(); st.refLine.forEach(p=>{ if(p.m==null||(pv&&p.t-pv.t>.1)){ pv=p.m==null?null:p; if(p.m!=null){c.moveTo(X(p.t),y(p.m,H));} return;} if(!pv) c.moveTo(X(p.t),y(p.m,H)); else c.lineTo(X(p.t),y(p.m,H)); pv=p; }); c.stroke(); }
    c.strokeStyle="#ff5d8f"; c.lineWidth=3*dpr; c.lineCap="round"; c.lineJoin="round"; c.beginPath(); let prev=null;
    st.live.forEach(p=>{ if(p.m==null){prev=null;return;} const mm=p.m-st.offset; if(!prev||p.t-prev.t>.25) c.moveTo(X(p.t),y(mm,H)); else c.lineTo(X(p.t),y(mm,H)); prev=p; }); c.stroke();
    if(st.head>=0){ c.strokeStyle="rgba(255,201,77,.9)"; c.lineWidth=2*dpr; c.beginPath(); c.moveTo(X(st.head),0); c.lineTo(X(st.head),H); c.stroke(); }
  }
  new ResizeObserver(fit).observe(canvas);
  return { st, draw, fit,
    setTarget(tl,dur){ st.target=tl; st.dur=dur; const ms=tl.map(n=>n.m); st.lo=Math.min(...ms)-5; st.hi=Math.max(...ms)+5; st.refLine=null; draw(); },
    setRef(pts,dur){ st.target=[]; st.refLine=pts; st.dur=dur; const ms=pts.filter(p=>p.m!=null).map(p=>p.m); if(ms.length){ st.lo=Math.min(...ms)-4; st.hi=Math.max(...ms)+4; } draw(); } };
}

function lyricAt(card,t){ card.el.querySelectorAll(".lyric span").forEach((sp,k)=>{ const n=card.tl[k]; sp.className= t<0?"": (t>=n.t&&t<n.t+n.d)?"on":(t>=n.t+n.d?"done":""); }); }

let busy=null; // {card, kind}
let openVid=null;
function closeVideo(){ if(openVid){ openVid.box.remove(); openVid.btn.innerHTML=ICON.yt+"<span>המקור</span>"; openVid=null; } }
function toggleVideo(card){
  if(openVid&&openVid.card===card){ closeVideo(); return; }

  const y=card.ch.yt, box=document.createElement("div"); box.className="vid";

function togglePlay(card){
  const btn=card.el.querySelector(".pl");
  if(busy&&busy.kind==="play"&&busy.card===card){ stopPlayback(); return; }
  if(busy) return;
  closeVideo(); busy={card,kind:"play"}; btn.innerHTML=ICON.stop;
  const end=()=>{ busy=null; btn.innerHTML=ICON.note; card.roll.st.head=-1; card.roll.draw(); lyricAt(card,-1); };
  const tick=t=>{ card.roll.st.head=t; card.roll.draw(); lyricAt(card,t); };

async function countdown(host){
  const d=document.createElement("div"); d.className="countdown"; host.appendChild(d);

async function toggleRec(card){
  const btn=card.el.querySelector(".rc");
  if(busy&&busy.kind==="rec"&&busy.card===card){ busy.finish(); return; }
  if(busy) { if(busy.kind==="play") stopPlayback(); else return; }
  closeVideo();
  try{ await getMic(); }catch(e){ toast(micErrorText(e),4500); return; }
  busy={card,kind:"wait"};
  await countdown(card.el);
  const live=[]; card.roll.st.live=live; card.roll.st.offset=0;
  const tm=median(card.tl.map(n=>n.m));
  const rec=startRecorder((t,m,r)=>{ live.push({t,m}); const vm=live.filter(p=>p.m!=null).map(p=>p.m);
    if(vm.length>3 && card.ch.type==="melody") card.roll.st.offset=Math.round(median(vm)-tm);
    card.roll.st.head=t; card.roll.draw(); lyricAt(card,t); });
  btn.classList.add("rec"); btn.innerHTML=ICON.stop+"<span>סיום</span>";
  const maxT=durOf(card.ch)+(card.ch.type==="high"?3:1.6);
  let done=false; const timer=setTimeout(()=>finish(),maxT*1000);
  function finish(){ if(done) return; done=true; clearTimeout(timer);
    const data=rec.stop(); btn.classList.remove("rec"); btn.innerHTML=ICON.mic+"<span>שירו</span>"; card.roll.st.head=-1; lyricAt(card,-1);
    busy=null; btn.disabled=true; btn.querySelector("span").textContent="מנתח…";
    setTimeout(()=>{ let res=null; try{ const A=analyze(data, card.ch.type==="high"?2100:1100);
        card.roll.st.live=A.frames.map(f=>({t:f.t-A.v0+0, m:f.m})); card.roll.st.offset= card.ch.type==="melody"&&A.voiced.length? Math.round(median(A.voiced.map(f=>f.m))-tm):0; card.roll.draw();
        res=scoreChallenge(card.ch,A); }catch(e){ console.error(e); }
      btn.disabled=false; btn.querySelector("span").textContent="שירו";
      if(!res){ toast("לא שמעתי מספיק. התקרבו למיקרופון ושירו חזק יותר.",3500); return; }
      const prev=store.get("best_"+card.ch.id,null); const isBest=prev==null||res.total>prev;
      if(isBest){ store.set("best_"+card.ch.id,res.total); card.el.querySelector(".best").textContent=res.total; }
      showResult(res,{title:card.ch.title,id:card.ch.id,isBest,prev,again:()=>toggleRec(card),next:()=>{ const nx=cards[cards.indexOf(card)+1]; if(nx) nx.el.scrollIntoView({behavior:"smooth"}); else toast("סיימתם את כל העשרה! נסו את מצב המסיבה."); }});
    },30);
  }
  busy={card,kind:"rec",finish};
}

  plRec=()=>{ plRec=null; clearTimeout(timer); const data=rec.stop(); btn.classList.remove("rec"); btn.querySelector("span").textContent="חקו עכשיו"; party.roll2.st.head=-1;
    const P=analyze(data); const res=scoreParty(R,P);
    party.roll2.st.live=P.frames.filter(f=>f.t>=P.t0-.1).map(f=>({t:f.t-P.t0,m:f.m})); party.roll2.draw();
    if(!res){ toast("לא שמעתי מספיק. התקרבו למיקרופון ונסו שוב.",3500); return; }
    const name=($("#plName").value||"").trim()||`מתחרה ${party.players.length+1}`; const src=($("#srcName").value||"").trim()||"המקור";
    party.players.push({name,...res}); renderBoard();
    showResult(res,{title:`${src}`, id:null, shareText:`🎤 ${name} קיבל ${res.total} בחיקוי של ${src} בבּוּל!!`, again:()=>recPlayer(), nextLabel:"השחקן הבא",
      next:()=>{ $("#plName").value=""; $("#plName").focus(); }});
  };
}
function renderBoard(){
  $("#pStep3").hidden=false; const src=($("#srcName").value||"").trim()||"המקור";
  const rows=[...party.players].sort((a,b)=>b.total-a.total);
  $("#board").innerHTML=rows.map((p,i)=>`<div class="row"><span class="rk">${i+1}</span><span class="nm"></span><span class="sc">${p.total}</span><span class="sub">מנגינה ${Math.round(p.meters[0][1])} · קצב ${Math.round(p.meters[1][1])} · קול ${Math.round(p.meters[2][1])}</span></div>`).join("");
  $("#board").querySelectorAll(".nm").forEach((el,i)=>el.textContent=rows[i].name+(i===0?` · הכי דומה ל${src}`:""));
}

/* ============ TABS / BOOT ============ */
function setTab(p){ closeVideo(); $("#tabCh").setAttribute("aria-selected",!p); $("#tabParty").setAttribute("aria-selected",p); $("#feed").hidden=p; $("#party").hidden=!p; stopPlayback(); if(p) setTimeout(()=>{party.roll1.fit(); party.roll2.fit();},30); }
$("#tabCh").onclick=()=>setTab(false); $("#tabParty").onclick=()=>setTab(true);

buildIntro(); CH.forEach(buildCard); initParty();
const vidIO=new IntersectionObserver(es=>es.forEach(e=>{ if(!e.isIntersecting&&openVid&&openVid.card.el===e.target) closeVideo(); }),{threshold:.3});
cards.forEach(c=>vidIO.observe(c.el));
if(location.hash==="#party") setTab(true);
else if(location.hash.startsWith("#c-")){ const el=document.getElementById(location.hash.slice(1)); if(el) setTimeout(()=>el.scrollIntoView(),50); }
if(window.speechSynthesis) speechSynthesis.getVoices();
// expose for testing
window.__kk={analyze,scoreChallenge,scoreParty,CH,targetFrames,timeline,showResult};
</script>
